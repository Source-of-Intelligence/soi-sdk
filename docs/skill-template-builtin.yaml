# ──────────────────── SOI Skill Manifest ────────────────────
# 内置插件模板
# 由宿主原生实现，不通过 WASM 加载
# 适用于系统级功能（代码执行、网络请求、shell 等）
# ───────────────────────────────────────────────────────────

apiVersion: v1
kind: Skill

# ========================================================================
# metadata
# ========================================================================
metadata:
    # 插件唯一标识，英文小写 + 短横线
    name: my-builtin-plugin

    # 语义化版本号
    version: 1.0.0

    # 作者 / 团队
    author: SOI Team

    # 一句话简介
    description: 一个内置插件示例，由宿主原生实现

    # 分类标签（可选）
    tags:
        - builtin
        - system
        - example

# ========================================================================
# spec
# ========================================================================
spec:
    # ── 运行时 ──
    runtime:
        # 固定值 builtin — 宿主原生实现，不走 WASM sandbox
        type: builtin

    # ====================================================================
    # provides
    # ====================================================================
    provides:
        # ── 触发词（可选）：用户输入匹配到任一触发词时优先调度此插件 ──
        # builtin 插件通常有丰富的触发词覆盖，建议中英双语
        triggers:
            - "执行命令"
            - "运行脚本"
            - "run command"
            - "execute script"
            - "帮我跑一下"

        instructions: | 
          描述词
