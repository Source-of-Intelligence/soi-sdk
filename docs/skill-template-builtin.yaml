# ──────────────────── SOI Skill Manifest ────────────────────
# 内置插件模板
# 由宿主原生实现，不通过 WASM 加载
# 适用于系统级功能（代码执行、网络请求、shell 等）
# ───────────────────────────────────────────────────────────

apiVersion: v1
kind: Skill

# ========================================================================
# metadata
# ========================================================================
metadata:
    # 插件唯一标识，英文小写 + 短横线
    name: my-builtin-plugin

    # 语义化版本号
    version: 1.0.0

    # 作者 / 团队
    author: SOI Team

    # 一句话简介
    description: 一个内置插件示例，由宿主原生实现

    # 分类标签（可选）
    tags:
        - builtin
        - system
        - example

# ========================================================================
# spec
# ========================================================================
spec:
    # ── 运行时 ──
    runtime:
        # 固定值 builtin — 宿主原生实现，不走 WASM sandbox
        type: builtin

    # ====================================================================
    # provides
    # ====================================================================
    provides:
        # ── 触发配置 ──
        triggers:
            keywords: [ "execute", "run", "cmd", "执行", "运行", "命令" ]
            prefix: "/cmd"
            priority: 200

        # ── 工具列表 ──
        tools:
          - name: execute_command      # 工具名，全局唯一，英文小写 + 下划线
            description: 执行 shell 命令

            parameters:
              - name: command         # 参数名
                type: string          # 类型: string | number | boolean | object | array
                required: true        # 是否必填
                description: 要执行的 shell 命令

            # 返回值描述（建议填写）
            returns: object with stdout and stderr

        instructions: |
          描述词
