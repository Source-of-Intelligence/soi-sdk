apiVersion: v1
kind: Skill
metadata:
    name: lotto
    version: 1.0.0
    author: SOI Team
    description: 大乐透号码生成器 — 生成指定组数的大乐透号码（前区 5 个 1-35 不重复 + 后区 2 个 1-12 不重复），格式「xx xx xx xx xx + xx xx」，不足两位补前置 0
    tags:
        - wasm
        - lottery
        - utility
spec:
    runtime:
        type: wasm
        entry: wasm/plugin.wasm
        wasm:
            sandbox:
                subdir: plugins/lotto
            timeout: 10s
    provides:
        triggers:
            - "大乐透"
            - "生成大乐透号码"
            - "随机选号"
            - "彩票号码"
            - "lotto"
            - "generate lottery numbers"
            - "给我一组大乐透"
            - "来几注大乐透"
        tools:
            - name: grand_lotto
              description: 生成指定组数的大乐透号码
              parameters:
                - name: Count
                  type: number
                  required: true
                  default: 1
                  description: 生成组数（正整数，1-100）
              returns: '{"groups": ["string array"], "count": number}'
